[package]
name = "dstack-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
publish = false

[[bin]]
name = "dstack"
path = "src/main.rs"

[features]
default = []
# Historical comparison tests require the archived shell-final reference.
shell-parity = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
